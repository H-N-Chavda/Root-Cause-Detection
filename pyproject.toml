[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "causal-bench"
version = "0.1.0"
description = "PC causal discovery on the CIPCaD-Bench industrial process datasets"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"

# Pinned to the versions present in the environment the pre-restructure test
# suite passed on (2026-08-30). Loosen deliberately, not by drift.
dependencies = [
    "numpy==2.5.2",
    "pandas==3.0.5",
    "python-pptx==1.0.2",
    "PyYAML==6.0.3",
    # Added in phase 2 for the EDA module. scipy/statsmodels supply the
    # hypothesis tests, scikit-learn the mutual information and the boosted
    # tree, dcor the distance correlation, matplotlib the figures.
    "scipy==1.18.1",
    "statsmodels==0.15.0",
    "scikit-learn==1.9.0",
    "dcor==0.7",
    "matplotlib==3.11.1",
    # Added in phase 3 for the algorithms themselves. tigramite provides PC and
    # PCMCI+ and the CMIknn estimator LSTE is built on; lingam provides
    # VAR-LiNGAM; networkx handles the graph conversions and cycle checks.
    "tigramite==5.2.10.1",
    "lingam==1.13.0",
    "networkx==3.6.1",
    # lingam imports these at package import time but does not need them for
    # VARLiNGAM or DirectLiNGAM; they are installed without their own
    # dependencies so they cannot drag scipy backwards (see the note below).
    "graphviz",
    "semopy",
    "psy",
    "pygam",
    "autograd",
]

# NOTE ON THE lingam PIN. lingam 1.13.0 declares `scipy<=1.13.1`, which has no
# wheel for Python 3.14 and cannot be built here (no OpenBLAS). That pin is
# conservative rather than real: VARLiNGAM and DirectLiNGAM were verified to fit
# and to reproduce a known one-way edge on scipy 1.18.1, and the phase 3 test
# suite exercises both. lingam is therefore installed with `--no-deps`, as are
# its import-time extras. `pip check` will report the conflict; it is expected
# and is recorded here rather than hidden.

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "pre-commit>=4.0",
]

[project.scripts]
causal-bench = "causal_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-q",
    "--cov=causal_bench",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]
markers = [
    "slow: touches a full dataset rather than a fixture slice",
]

[tool.coverage.run]
source = ["causal_bench"]
branch = true

[tool.ruff]
line-length = 92
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
# E731 (lambda assignment) is pre-existing in algorithms/pc.py, which the
# restructure was required to move verbatim. Reported, not fixed.
ignore = ["E731"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
# `algorithms/pc_manual.py` is the former PC_Algorithm/utils.py, moved verbatim under
# a no-refactor constraint. Its 60 findings are all typing-modernisation
# (typing.Dict -> dict, Optional[X] -> X | None) plus one long line -- reported,
# deliberately not fixed. Real bug classes (F, B) still run against it.
"src/causal_bench/algorithms/pc_manual.py" = ["UP006", "UP035", "UP037", "UP045", "E501"]

[tool.ruff.format]
# Same reason: reformatting a verbatim move would bury it in whitespace noise.
exclude = ["src/causal_bench/algorithms/pc_manual.py", "tests/test_pc.py"]

[tool.mypy]
# No python_version pin: the installed numpy stubs use 3.12+ syntax, so mypy
# must analyse under the interpreter actually running it.
files = ["src", "tests"]
ignore_missing_imports = true
warn_unused_configs = true
# Non-strict: the moved algorithm module is only partially annotated and
# tightening it would mean editing it.
disallow_untyped_defs = false
check_untyped_defs = false

# `algorithms/pc_manual.py` is a verbatim move under a no-refactor constraint (only
# the file name changed in phase 3, so that `pc.py` could become the tigramite
# wrapper). It carries pre-existing mypy errors from the `re.Match | None` .group
# calls and the `Dict[str, object]` ground-truth `info` mapping.
# Reported, not fixed; lift this block when the freeze on that module lifts.
[[tool.mypy.overrides]]
module = "causal_bench.algorithms.pc_manual"
ignore_errors = true
