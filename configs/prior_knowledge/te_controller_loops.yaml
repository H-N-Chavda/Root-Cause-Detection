# Candidate controller loops for the Tennessee Eastman case.
#
# PROVENANCE WARNING -- read before using any with-prior-knowledge result.
#
# I do not have verified Tennessee Eastman control-scheme documentation, so this
# list is NOT independent domain knowledge. It is assembled from the only two
# sources in the repository that can be checked:
#
#   1. WHICH PAIRS are candidates: the six near-unity correlations the Phase 2
#      EDA measured (|r| >= 0.95 out of 465 pairs). In a controlled process a
#      near-unity correlation between two tags is the signature of a controlled
#      variable moving with its manipulated variable, which is what a controller
#      loop looks like in the data.
#   2. WHICH DIRECTION each edge runs: the ground truth file.
#
# Source 2 makes every `forced` entry below an ORACLE prior. A with-prior-
# knowledge run using it cannot be read as validation of anything -- it shows
# the machinery works and gives a best case, nothing more. This is stated again
# in the run report next to every with-PK score.
#
# Decision 6 also stands: the ground truth is acyclic and contains no feedback
# loops, so it cannot confirm a controller loop even in principle. The
# `candidates` block below records the four measured pairs the ground truth is
# silent about; they are documentation only and are not converted into
# constraints.

description: >
  Candidate Tennessee Eastman controller loops. Pair selection is measured
  (Phase 2 near-unity correlations); edge direction is taken from the ground
  truth, which makes the forced entries an oracle prior rather than independent
  domain knowledge.

edges:
  # --- Forced: measured near-unity pair, direction from the ground truth ---
  - cause: X10
    effect: X28
    kind: forced
    lag: 0
    note: "measured r = +0.9984, the strongest pair in the data; ground truth has X10 -> X28"

  - cause: X1
    effect: X25
    kind: forced
    lag: 0
    note: "measured r = +0.9973; ground truth has X1 -> X25"

  # --- Forbidden: the reverse of each forced edge. Implied by the forced
  # --- direction together with the ground truth's acyclicity, not measured.
  - cause: X28
    effect: X10
    kind: forbidden
    lag: 0
    note: "reverse of a forced edge; the ground truth is acyclic so both cannot hold"

  - cause: X25
    effect: X1
    kind: forbidden
    lag: 0
    note: "reverse of a forced edge; the ground truth is acyclic so both cannot hold"

  # --- An edge naming a variable with no column in datasetTE.csv. Kept on
  # --- purpose: it exercises the "declared but not applicable" path, and the
  # --- validation report has to show it being dropped rather than silently
  # --- ignored. X27 is one of the two latent nodes from decision 2.
  - cause: X5
    effect: X27
    kind: forced
    lag: 0
    note: "ground truth edge; X27 has no column in the data, so this must be dropped"

# Measured near-unity pairs the ground truth says nothing about. Recorded so the
# gap is visible: four of the six strongest correlations in the data correspond
# to no ground-truth edge at all. Not converted into constraints -- asserting a
# direction here would be invention.
candidates:
  - pair: [X7, X16]
    correlation: 0.9875
    ground_truth: none
  - pair: [X7, X13]
    correlation: 0.9875
    ground_truth: none
  - pair: [X13, X16]
    correlation: 0.9851
    ground_truth: none
  - pair: [X23, X24]
    correlation: -0.9559
    ground_truth: none
